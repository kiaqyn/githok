<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf0f6"><meta name="description" content="像刷短视频一样发现 GitHub 好项目。真实开源数据，轻松发现、收藏和探索。">
  <title>GitHok · 好项目，划着看</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css">
  <link rel="preload" href="/fonts/Manrope.ttf" as="font" type="font/ttf" crossorigin>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">跳到项目内容</a>
  <header class="masthead">
    <a class="brand" href="/" aria-label="GitHok 首页" data-i18n-aria="home">githok<span>.</span></a>
    <nav aria-label="主要导航" data-i18n-aria="navigation">
      <button class="nav-item active" data-view="discover" aria-current="page"><span data-i18n="discover">发现项目</span></button>
      <button class="nav-item" data-view="saved"><span data-i18n="saved">我的收藏</span><span id="saved-count" class="nav-count">0</span></button>
      <button class="nav-item" data-view="history"><span data-i18n="history">浏览足迹</span></button>
    </nav>
    <div class="masthead-tools"><button id="github-account-button" class="icon-button" data-i18n-aria="githubTitle" data-i18n-title="githubTitle"><span data-icon="github"></span></button><button id="language-toggle" class="text-button" aria-label="Switch to English" title="Switch to English"><span data-language-option="en">EN</span><span class="language-slash">/</span><span data-language-option="zh">中文</span><span id="language-label" class="sr-only">EN</span></button><button id="help-button" data-i18n-aria="help" data-i18n-title="help" class="icon-button" aria-label="操作指南" title="操作指南"><span data-icon="help"></span></button></div>
  </header>
  <main id="main">
    <section class="page-heading"><div><h1 id="view-title">发现开源。</h1><p id="view-description">少一点大海捞针，多一点不期而遇。</p></div><form id="search-form" class="search-form" role="search"><span data-icon="search"></span><input id="search" aria-label="搜索 GitHub 项目" placeholder="搜索 GitHub 项目…" maxlength="120" autocomplete="off"><button type="button" id="clear-search" class="icon-button" aria-label="清空搜索" data-i18n-aria="clearSearch" hidden><span data-icon="x"></span></button></form></section>
    <section id="discovery-controls" aria-label="发现筛选" data-i18n-aria="filters">
      <div class="topic-tabs" role="group" aria-label="兴趣分类" data-i18n-aria="interests"><button class="topic active" data-topic="all" data-i18n="allTopics">全部推荐</button><button class="topic" data-topic="ai" data-i18n="ai">AI & 智能</button><button class="topic" data-topic="tools" data-i18n="tools">开发工具</button><button class="topic" data-topic="web" data-i18n="web">网页开发</button><button class="topic" data-topic="design" data-i18n="design">设计灵感</button><button class="topic" data-topic="data" data-i18n="data">数据科学</button></div>
      <div class="feed-toolbar"><div id="mode-tabs" class="mode-tabs" role="group" aria-label="排序方式" data-i18n-aria="sorting"><button class="mode active" data-mode="popular" data-i18n="popular">热门精选</button><button class="mode" data-mode="new" data-i18n="new">最近上新</button><button class="mode" data-mode="gems" data-i18n="gems">小众宝藏</button></div><span id="search-caption" class="search-caption" hidden></span><div class="feed-tools"><button id="restart-feed" class="icon-button" data-i18n-aria="restartFeed" data-i18n-title="restartFeed"><span data-icon="refresh"></span></button></div></div>
    </section>
    <div id="collection-toolbar" class="collection-toolbar" hidden><span id="collection-count"></span><div class="collection-switch" role="group" data-i18n-aria="collectionLayout"><button id="list-button" aria-pressed="true" data-i18n="listView">列表</button><button id="stage-button" aria-pressed="false" data-i18n="stageView">逐个看</button></div></div>
    <section id="feed-layout" class="feed-layout" aria-label="项目推荐" data-i18n-aria="recommendations">
      <div id="feed-art" class="feed-art" aria-hidden="true" hidden><img src="/art/silver-sculpture-v1.png" alt="" width="1254" height="1254" fetchpriority="high" decoding="async"></div>
      <div id="feed-host" aria-live="polite" aria-atomic="false"><div class="loading-state"><div class="loading-line"></div><div class="loading-line short"></div><p data-i18n="loadingFeed">正在开源世界里捞好东西…</p></div></div>
      <div id="connection-status" class="connection-status" hidden><span id="connection-message" role="status"></span><button id="retry-feed" aria-live="off"></button></div>
      <aside id="action-rail" class="action-rail" aria-label="项目操作" data-i18n-aria="actions" hidden>
        <button id="github-star-button" class="rail-action github-star-action" aria-label="在 GitHub 上 Star" aria-pressed="false"><span data-icon="star"></span><span id="github-star-label">Star</span></button>
        <button id="save-button" class="rail-action" aria-label="收藏项目" aria-pressed="false"><span data-icon="bookmark"></span><span id="save-label">收藏</span></button>
        <button id="readme-button" class="rail-action" data-i18n-aria="readReadme"><span data-icon="file-text"></span><span data-i18n="readMore">README</span></button>
        <button id="share-button" class="rail-action"><span data-icon="share"></span><span id="share-label">分享</span></button>
        <div class="rail-divider"></div>
        <button id="prev-button" class="step-button" aria-label="上一个项目" title="上一个（↑ / K）" data-i18n-aria="previous" data-i18n-title="previousTip"><span data-icon="arrow-up"></span><span data-i18n="previousShort">上一个</span></button>
        <button id="next-button" class="step-button next-button" aria-label="下一个项目" title="下一个（↓ / J / 空格）" data-i18n-aria="next" data-i18n-title="nextTip"><span data-i18n="nextShort">下一个</span><span data-icon="arrow-down"></span></button>
      </aside>
    </section>
    <footer id="feed-footer" class="feed-footer"><div class="feed-counter"><span id="feed-position"></span><span id="feed-state"></span></div><span class="swipe-tip"><span data-icon="mouse"></span><span data-i18n="swipeTip">滚动 / 上划，发现下一个</span></span><button id="about-button" class="source-button" data-i18n-aria="about" data-i18n-title="about"><span id="data-origin" data-i18n="realData">真实 GitHub 数据</span></button><progress id="feed-progress" value="0" max="1" data-i18n-aria="browseProgress" aria-label="浏览进度"></progress></footer>
    <div id="source-note" class="source-note"></div>
  </main>
  <div id="toast" role="status" class="toast" hidden></div>
  <div id="github-star-status" class="sr-only" role="status"></div>
  <dialog id="github-dialog" class="info-dialog github-dialog" aria-labelledby="github-title"><div class="dialog-top"><h2 id="github-title" data-i18n="githubTitle">Star，直接到 GitHub。</h2><button class="icon-button close-dialog" data-i18n-aria="close"><span data-icon="x"></span></button></div><p data-i18n="githubIntro">双击项目展示区，即可用你的 GitHub 账号添加 Star。本地收藏仍单独保留。</p><p id="github-account-status" role="status"></p><p id="github-permission-note" data-i18n="githubPermission">登录会跳转到 GitHub 授权。公开仓库授权范围为 public_repo，请先核对 GitHub 展示的权限。</p><div class="github-dialog-actions"><button id="github-login" class="primary-button" data-i18n="githubLogin">前往 GitHub 登录</button><button id="github-logout" class="secondary-button" data-i18n="githubLogout" hidden>退出 GitHub 连接</button></div><p class="github-hint" data-i18n="githubSessionNote">登录仅保留在当前服务会话中，服务重启后需重新登录。</p></dialog>
  <dialog id="detail-dialog" class="detail-dialog"><div class="dialog-top"><h2 id="detail-title">项目详情</h2><button class="icon-button close-dialog" aria-label="关闭详情" data-i18n-aria="closeDetail"><span data-icon="x"></span></button></div><div id="detail-meta"></div><div class="readme-heading"><h3>README</h3><a id="original-readme" data-i18n="originalReadme" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></div><article id="readme-content" class="readme-content"></article></dialog>
  <dialog id="info-dialog" class="info-dialog"><div class="dialog-top"><h2 id="info-title">关于 GitHok</h2><button class="icon-button close-dialog" aria-label="关闭" data-i18n-aria="close"><span data-icon="x"></span></button></div><div id="info-content"></div></dialog>
</body>
</html>
