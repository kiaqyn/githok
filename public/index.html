<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101214"><meta name="description" content="像刷短视频一样发现 GitHub 好项目。真实开源数据，轻松发现、收藏和探索。">
  <title>GitHok · 好项目，划着看</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到项目内容</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="GitHok 首页"><img src="/favicon.svg" alt="" width="36" height="36"><span>GitHok<span class="brand-dot">.</span></span></a>
    <p class="brand-sub">开源世界，划着看。</p>
    <div class="nav-label">你的探索空间</div>
    <nav aria-label="主要导航">
      <button class="nav-item active" data-view="discover" aria-current="page"><span data-icon="compass"></span>发现项目<span class="nav-live"></span></button>
      <button class="nav-item" data-view="saved"><span data-icon="bookmark"></span>我的收藏<span id="saved-count" class="nav-count">0</span></button>
      <button class="nav-item" data-view="history"><span data-icon="clock"></span>浏览足迹</button>
    </nav>
    <div class="sidebar-note"><span class="note-icon" data-icon="sparkles"></span><p>下一个灵感，<br>也许就在下一划。</p><span class="note-small">STAY CURIOUS. BUILD SOMETHING.</span><span class="note-orbit"></span></div>
    <div class="sidebar-bottom"><div class="local-status"><span></span>无需登录，自由探索</div><button id="about-button" class="quiet-button"><span data-icon="info"></span>关于 GitHok<span class="version">v0.1</span></button></div>
  </aside>
  <main id="main">
    <header class="topbar"><div class="breadcrumb">探索 <span>/</span> <strong id="breadcrumb-view">为你发现</strong></div><div class="topbar-right"><span class="keyboard-hint"><kbd>↑</kbd><kbd>↓</kbd> 切换项目</span><button id="help-button" class="icon-button" aria-label="操作指南" title="操作指南"><span data-icon="keyboard"></span></button><a class="github-link" href="https://github.com" target="_blank" rel="noopener noreferrer"><span data-icon="github"></span><span>GitHub</span><span data-icon="arrow-up-right"></span></a></div></header>
    <section class="page-heading"><div><div class="eyebrow"><span></span>OPEN SOURCE, OPEN POSSIBILITIES</div><h1 id="view-title">好项目，<span>划着看。</span></h1><p id="view-description">少一点大海捞针，多一点不期而遇。</p></div><form id="search-form" class="search-form" role="search"><span data-icon="search"></span><input id="search" aria-label="搜索 GitHub 项目" placeholder="搜点感兴趣的…" maxlength="120" autocomplete="off"><button type="button" id="clear-search" class="icon-button" aria-label="清空搜索" hidden><span data-icon="x"></span></button><kbd>↵</kbd></form></section>
    <section id="discovery-controls" aria-label="发现筛选">
      <div class="topic-tabs" role="group" aria-label="兴趣分类"><button class="topic active" data-topic="all"><span data-icon="sparkles"></span>全部推荐</button><button class="topic" data-topic="ai">AI & 智能</button><button class="topic" data-topic="tools">开发工具</button><button class="topic" data-topic="web">网页开发</button><button class="topic" data-topic="design">设计灵感</button><button class="topic" data-topic="data">数据科学</button></div>
      <div class="feed-toolbar"><div id="mode-tabs" class="mode-tabs" role="group" aria-label="排序方式"><button class="mode active" data-mode="popular">热门精选</button><button class="mode" data-mode="new">最近上新</button><button class="mode" data-mode="gems">小众宝藏</button></div><span id="search-caption" class="search-caption" hidden></span><span class="real-source"><span></span>真实 GitHub 数据</span></div>
    </section>
    <section id="feed-layout" class="feed-layout" aria-label="项目推荐">
      <div id="feed-host" aria-live="polite" aria-atomic="false"><div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div><p>正在开源世界里捞好东西…</p></div></div>
      <aside id="action-rail" class="action-rail" aria-label="项目操作" hidden>
        <button id="save-button" class="rail-action" aria-label="收藏项目" aria-pressed="false"><span class="rail-circle" data-icon="bookmark"></span><span id="save-label">收藏</span></button>
        <button id="readme-button" class="rail-action"><span class="rail-circle" data-icon="file-text"></span><span>详细了解</span></button>
        <button id="share-button" class="rail-action"><span class="rail-circle" data-icon="link"></span><span>复制链接</span></button>
        <div class="rail-divider"></div>
        <button id="prev-button" class="round-button" aria-label="上一个项目" title="上一个（↑ / K）"><span data-icon="chevron-up"></span></button>
        <button id="next-button" class="round-button next-button" aria-label="下一个项目" title="下一个（↓ / J / 空格）"><span data-icon="chevron-down"></span></button>
      </aside>
    </section>
    <footer id="feed-footer" class="feed-footer"><span class="swipe-tip"><span data-icon="mouse"></span>滚动 / 上划，发现下一个 <span class="tiny-arrow">↓</span></span><span id="feed-position"></span></footer>
    <div id="source-note" class="source-note"></div>
  </main>
  <div id="toast" role="status" class="toast" hidden></div>
  <dialog id="detail-dialog" class="detail-dialog"><div class="dialog-top"><div><div class="eyebrow">BEHIND THE REPOSITORY</div><h2 id="detail-title">项目详情</h2></div><button class="icon-button close-dialog" aria-label="关闭详情"><span data-icon="x"></span></button></div><div id="detail-meta"></div><div class="readme-heading"><h3><span data-icon="file-text"></span>README</h3><a id="original-readme" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></div><article id="readme-content" class="readme-content"></article></dialog>
  <dialog id="info-dialog" class="info-dialog"><div class="dialog-top"><h2 id="info-title">关于 GitHok</h2><button class="icon-button close-dialog" aria-label="关闭"><span data-icon="x"></span></button></div><div id="info-content"></div></dialog>
</body>
</html>
